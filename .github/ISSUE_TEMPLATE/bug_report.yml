name: Bug report
description: Report incorrect behavior without sharing secrets or private data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed real credentials, private source code, and personal data.
          required: true
        - label: This is not an undisclosed security vulnerability in Agent Config Guard.
          required: true
  - type: input
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and observed behavior
    validations:
      required: true


name: Rule proposal
description: Propose a deterministic security check.
title: "[Rule]: "
labels: ["rule-proposal"]
body:
  - type: textarea
    attributes:
      label: Risk
      description: Explain the trust boundary and realistic impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Safe and unsafe examples
      description: Use synthetic values only.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Remediation and false positives
    validations:
      required: true


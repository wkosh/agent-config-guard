# Copy to .github/workflows/agent-config-guard.yml in a repository you maintain.
# The PyPI install below works AFTER 0.1.1 has actually been published.
name: Review agent configuration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install reviewed scanner version
        run: python -m pip install agent-config-guard==0.1.1
      - name: Scan recognized agent and MCP configuration
        run: agent-config-guard . --format sarif --output reports/agent-config-guard.sarif --fail-on high
      - name: Preserve findings, including when the severity gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-config-guard-report
          path: reports/agent-config-guard.sarif
          if-no-files-found: ignore

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kosh-config-guard"
dynamic = ["version"]
description = "Offline, static security scanner for coding-agent and MCP configuration files."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "wkosh" }]
keywords = ["security", "mcp", "ai-agents", "static-analysis", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
agent-config-guard = "agent_config_guard.cli:main"

[project.urls]
Homepage = "https://github.com/wkosh/agent-config-guard"
Issues = "https://github.com/wkosh/agent-config-guard/issues"
Source = "https://github.com/wkosh/agent-config-guard"
Documentation = "https://github.com/wkosh/agent-config-guard#readme"
Changelog = "https://github.com/wkosh/agent-config-guard/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/agent_config_guard/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/scripts", "/.github", "/README.md", "/CHANGELOG.md", "/SECURITY.md", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_config_guard"]


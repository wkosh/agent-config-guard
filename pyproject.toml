[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-config-guard"
version = "0.1.0"
description = "Offline, static security scanner for coding-agent and MCP configuration files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "wkosh" }]
keywords = ["security", "mcp", "ai-agents", "static-analysis", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
agent-config-guard = "agent_config_guard.cli:main"

[project.urls]
Homepage = "https://github.com/wkosh/agent-config-guard"
Issues = "https://github.com/wkosh/agent-config-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_config_guard"]

